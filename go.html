<!doctype html>

<head>
<meta charset="utf-8">

<title>인더스트리아</title>
<style>body{margin:0;padding:24px 16px;font:17px/1.5 system-ui,sans-serif;text-align:center}</style>
</head>
<body>
<p>원스토어로 이동합니다</p>
<p><a id="go" href="https://m.onestore.co.kr/v2/ko-kr/app/0001008835">원스토어에서 받기</a></p>
<script>
(function () {
  var STORE = "https://m.onestore.co.kr/v2/ko-kr/app/0001008835";
  var LOG = "https://script.google.com/macros/s/AKfycbzYNIxPwg_sUqGrnZeGZWTzSOPKtbl5DG-8RyrEcIBu72jstk6ZnZx0ecaseFhrgR03DQ/exec";
  var v = new URLSearchParams(location.search).get("v") || "";
  if (!/^[A-Za-z0-9_-]{1,20}$/.test(v)) v = "x";
  var done = false;
  function go() { if (done) return; done = true; location.replace(STORE); }
  setTimeout(go, 600);
  try {
    fetch(LOG + "?go=" + encodeURIComponent(v) + "&w=gh", { method: "GET", mode: "no-cors", keepalive: true, credentials: "omit", cache: "no-store", referrerPolicy: "no-referrer" }).then(go, go);
  } catch (e) { go(); }
})();
</script>
</body>
</html>
